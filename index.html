<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>헬린이 AI 기구 루틴 메이커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* 마크다운 결과 가독성 스타일 */
    #resultContent h1, #resultContent h2, #resultContent h3 {
      color: #34d399;
      font-weight: 700;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    #resultContent h1 { font-size: 1.25rem; }
    #resultContent h2 { font-size: 1.125rem; border-bottom: 1px solid #334155; padding-bottom: 0.25rem; }
    #resultContent h3 { font-size: 1rem; }
    #resultContent p { margin-bottom: 0.75rem; color: #e2e8f0; }
    #resultContent ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    #resultContent ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    #resultContent li { margin-bottom: 0.35rem; color: #cbd5e1; }
    #resultContent strong { color: #f8fafc; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div class="max-w-xl mx-auto p-5">
    <header class="text-center my-6">
      <h1 class="text-2xl font-bold text-emerald-400">🏋️ 헬린이 AI 기구 루틴 메이커</h1>
      <p class="text-slate-400 text-sm mt-2">주변 운동기구 사진을 찍어 올리면 오늘 할 루틴을 짜드립니다.</p>
    </header>

    <main class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 space-y-5">
      <!-- 사진 업로드 영역 -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-sm font-medium text-slate-300">
            1. 운동기구 사진 추가 (여러 장 누적 가능)
          </label>
          <span id="photoCount" class="text-xs text-emerald-400 font-semibold">0장 선택됨</span>
        </div>

        <label class="flex items-center justify-center w-full py-3 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 border border-dashed border-slate-500 cursor-pointer transition text-sm font-semibold text-emerald-300">
          <span>+ 사진 촬영 또는 갤러리에서 추가</span>
          <input
            type="file"
            id="imageInput"
            accept="image/*"
            multiple
            class="hidden"
          />
        </label>

        <!-- 미리보기 그리드 -->
        <div id="previewContainer" class="grid grid-cols-3 gap-2.5 mt-3"></div>
      </div>

      <!-- 옵션 선택 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">운동 목표</label>
          <select id="goalSelect" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400">
            <option value="전신 근력 및 기초 체력 향상">전신 기초 체력</option>
            <option value="상체 위주 근성장">상체 위주</option>
            <option value="하체 및 코어 강화">하체 위주</option>
            <option value="체지방 감량 및 다이어트">다이어트 / 유산소 병행</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">운동 시간</label>
          <select id="durationSelect" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-400">
            <option value="30분 (짧고 굵게)">30분</option>
            <option value="45분 (표준)" selected>45분</option>
            <option value="60분 (충분히)">60분</option>
          </select>
        </div>
      </div>

      <!-- 실행 버튼 -->
      <button
        id="submitBtn"
        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        기구 분석하고 루틴 받기
      </button>
    </main>

    <!-- 로딩 표시 -->
    <div id="loading" class="hidden text-center my-8 space-y-3">
      <div class="inline-block w-8 h-8 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-emerald-300">AI 트레이너가 기구를 분석하고 루틴을 짜는 중입니다...</p>
    </div>

    <!-- 결과 출력 영역 -->
    <section id="resultSection" class="hidden mt-6 bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
      <div id="resultContent" class="text-sm leading-relaxed"></div>
    </section>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const previewContainer = document.getElementById('previewContainer');
    const photoCount = document.getElementById('photoCount');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const resultSection = document.getElementById('resultSection');
    const resultContent = document.getElementById('resultContent');

    let compressedImages = [];

    // 이미지를 가로 최대 800px, JPEG 0.75 화질로 압축
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('이미지 형식이 올바르지 않습니다.'));
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const scale = MAX_WIDTH / Math.max(img.width, MAX_WIDTH);
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // 미리보기 화면 갱신
    function renderPreviews() {
      previewContainer.innerHTML = '';
      photoCount.textContent = `${compressedImages.length}장 선택됨`;

      compressedImages.forEach((base64, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'relative group';

        const imgEl = document.createElement('img');
        imgEl.src = base64;
        imgEl.className = 'w-full h-24 object-cover rounded-lg border border-slate-600';

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '×';
        delBtn.className = 'absolute top-1 right-1 w-6 h-6 rounded-full bg-slate-900/80 text-white text-sm font-bold flex items-center justify-center hover:bg-red-500';
        delBtn.onclick = () => {
          compressedImages.splice(index, 1);
          renderPreviews();
        };

        wrapper.appendChild(imgEl);
        wrapper.appendChild(delBtn);
        previewContainer.appendChild(wrapper);
      });
    }

    // 파일 선택 시 기존 목록에 누적 추가
    imageInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      for (const file of files) {
        try {
          const base64 = await compressImage(file);
          compressedImages.push(base64);
        } catch (err) {
          alert(err.message);
        }
      }

      imageInput.value = ''; // 같은 파일이나 연속 촬영 재선택 허용
      renderPreviews();
    });

    // API 호출
    submitBtn.addEventListener('click', async () => {
      if (compressedImages.length === 0) {
        alert('먼저 운동기구 사진을 1장 이상 추가해주세요.');
        return;
      }

      // Vercel 요청 크기 제한(4.5MB) 사전 검사
      const totalBytes = JSON.stringify({ images: compressedImages }).length;
      if (totalBytes > 4.2 * 1024 * 1024) {
        alert('사진 용량이 너무 큽니다. 일부 사진을 삭제하고 다시 시도해주세요.');
        return;
      }

      submitBtn.disabled = true;
      loading.classList.remove('hidden');
      resultSection.classList.add('hidden');

      try {
        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            images: compressedImages,
            goal: document.getElementById('goalSelect').value,
            duration: document.getElementById('durationSelect').value,
          }),
        });

        const rawText = await response.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch {
          throw new Error(`서버 응답 오류 (${response.status}): ${rawText.slice(0, 120)}`);
        }

        if (!response.ok) {
          throw new Error(data.error || '루틴 생성에 실패했습니다.');
        }

        resultContent.innerHTML = marked.parse(data.result);
        resultSection.classList.remove('hidden');
        resultSection.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
